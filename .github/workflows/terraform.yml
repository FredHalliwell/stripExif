name: 'Terraform'

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, staging, prod] # These are just examples. There is no <env>.conf file for other environments, so they won't work
        default: dev

permissions:
  id-token: write
  contents: read

jobs:

  tfsec:
    uses: ./.github/workflows/codeQuality.yml
    permissions:
      actions: read
      contents: read
      security-events: write


  terraform:
    needs: tfsec
    name: 'Terraform'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Get region
      run: echo "REGION=$(awk -F'"' '/^region/ {print $2}' bootstrap/backend_config/${{ inputs.environment || 'dev' }}.conf)" >> "$GITHUB_ENV"

    - name: 'Configure AWS credentials'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.REGION }}
        role-session-name: GitHubActionsSession

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v1
      with:
        terraform_version: "latest"

    - name: Terraform Init
      run: terraform init -input=false -backend-config=bootstrap/backend_config/${{ inputs.environment || 'dev' }}.conf

    - name: Terraform Format
      run: terraform fmt -check

    - name: Terraform Plan
      run: terraform plan -input=false -var-file=bootstrap/backend_config/${{ inputs.environment || 'dev' }}.tfvars -out=tfplan

    - name: Terraform Apply
      run: terraform apply -auto-approve -input=false tfplan