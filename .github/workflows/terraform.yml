name: 'Terraform'

on:
  push:
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:

  tfsec:
    uses: ./.github/workflows/codeQuality.yml
    permissions:
      actions: read
      contents: read
      security-events: write


  terraform:
    needs: tfsec
    name: 'Terraform'
    runs-on: ubuntu-latest
    # environment: production

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 'Configure AWS credentials'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: eu-west-2
        role-session-name: GitHubActionsSession

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v1
      with:
        terraform_version: "latest"

    - name: Terraform Init
      run: terraform init -input=false -backend-config=bootstrap/backend_config/dev.conf

    - name: Terraform Format
      run: terraform fmt -check

    - name: Terraform Plan
      run: terraform plan -input=false -var-file=bootstrap/backend_config/dev.tfvars -out=tfplan

    - name: Terraform Apply
      run: terraform apply -auto-approve -input=false tfplan